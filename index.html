<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet ID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="title">🐾 Pet ID</div>
    <div class="toggle" onclick="toggleDarkMode()">🌙</div>
  </div>

  <!-- Card -->
  <div class="card">

    <div class="image-wrapper">
      <img id="petImage">
      <div class="badge">LOST</div>
    </div>

    <h1 id="petName"></h1>
    <p id="petInfo" class="info"></p>

    <div class="divider"></div>

    <div class="contact">
      <p class="owner" id="ownerName"></p>

      <a id="callBtn" class="btn primary">📞 Call Owner</a>
      <a id="smsBtn" class="btn secondary">💬 Send Message</a>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    Help me get home 🐶
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
