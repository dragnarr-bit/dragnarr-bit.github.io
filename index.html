<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Happy anniversary! 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #ffe4ec; /* fallback color */
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1; /* behind content */
      }

      .slideshow {
        position: relative;
        width: 100%;
        height: 450px;
        overflow: hidden;
        border-radius: 1rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }
      .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1s ease-in-out;
      }
      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .slide.active {
        opacity: 1;
      }
      .caption {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        padding: 8px 16px;
        border-radius: 1rem;
        font-size: 1rem;
        opacity: 0;
        transition: opacity 1s;
      }
      .slide.active .caption {
        opacity: 1;
      }
      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2rem;
        color: white;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 50%;
        padding: 6px 12px;
        cursor: pointer;
        user-select: none;
      }
      .arrow:hover {
        background: rgba(0, 0, 0, 0.7);
      }
      .arrow.left {
        left: 15px;
      }
      .arrow.right {
        right: 15px;
      }
      .dots {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition: background 0.3s;
      }
      .dot.active {
        background: white;
      }

      #playButton {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #ec4899
